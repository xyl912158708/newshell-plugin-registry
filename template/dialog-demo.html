<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹窗示例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary, #1e1e2e);
    color: var(--text-primary, #cdd6f4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    gap: 20px;
  }
  h2 {
    font-size: 16px;
    color: var(--accent-color, #89b4fa);
  }
  .info-card {
    background: var(--bg-secondary, #313244);
    border: 1px solid var(--border-color, #45475a);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  .info-card p {
    font-size: 13px;
    color: var(--text-secondary, #a6adc8);
    margin: 6px 0;
  }
  .info-card .key {
    color: var(--accent-color, #89b4fa);
    font-weight: 600;
  }
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent-color, #89b4fa);
    color: #1e1e2e;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(137, 180, 250, 0.3);
  }
  .btn-close {
    background: var(--bg-tertiary, #45475a);
    color: var(--text-primary, #cdd6f4);
    border: 1px solid var(--border-color, #585b70);
  }
  .btn-close:hover {
    background: var(--danger-color, #f38ba8);
    color: #fff;
    border-color: transparent;
  }
  .params-display {
    background: var(--bg-tertiary, #45475a);
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
    font-family: 'Consolas', 'Menlo', monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-width: 400px;
    width: 100%;
    text-align: left;
    color: var(--text-secondary, #a6adc8);
    max-height: 120px;
    overflow-y: auto;
  }
  .empty {
    color: var(--text-muted, #6c7086);
    font-style: italic;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h2>📋 插件弹窗示例</h2>
  
  <div class="info-card">
    <p>宽高自定义 | 居中显示 | iframe 内容</p>
    <p style="margin-top:10px" v-if="hasData">传入参数:</p>
  </div>
  
  <div id="params" class="params-display">
    <span class="empty">（等待接收参数...）</span>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="sendResult()">✅ 返回结果并关闭</button>
    <button class="btn-close" onclick="closeDialog()">✕ 关闭弹窗</button>
  </div>

  <script>
    let hasData = false

    // 监听主面板传来的初始数据
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'newshell:dialog-params') {
        hasData = true
        const paramsEl = document.getElementById('params')
        paramsEl.textContent = JSON.stringify(event.data.data, null, 2)
      }
    })

    // 关闭弹窗（不返回结果）
    function closeDialog() {
      parent.postMessage({ type: 'newshell:dialog-close' }, '*')
    }

    // 返回结果并关闭
    function sendResult() {
      parent.postMessage({
        type: 'newshell:dialog-close',
        result: {
          confirmed: true,
          message: '用户确认了操作',
          timestamp: Date.now()
        }
      }, '*')
    }
  </script>
</body>
</html>
