<!DOCTYPE html>
<html lang="zh-CN" data-ui-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹窗示例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--ui-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
    background: var(--ui-bg, #080b12);
    color: var(--ui-text, #e6ecf3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    gap: 20px;
  }
  h2 {
    font-size: 16px;
    color: var(--ui-primary, #2dd4bf);
  }
  ui-card { width: 100%; max-width: 400px; }
  .info-body p {
    font-size: 13px;
    color: var(--ui-text-secondary, #9aa4b8);
    margin: 6px 0;
  }
  .info-body .key {
    color: var(--ui-primary, #2dd4bf);
    font-weight: 600;
  }
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .params-display {
    background: var(--ui-surface-hover, #1e2536);
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
    font-family: 'Consolas', 'Menlo', monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-width: 400px;
    width: 100%;
    text-align: left;
    color: var(--ui-text-secondary, #9aa4b8);
    max-height: 120px;
    overflow-y: auto;
  }
  .empty {
    color: var(--ui-text-muted, #8494b3);
    font-style: italic;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h2><ui-icon name="file" size="lg"></ui-icon> 插件弹窗示例</h2>
  
  <ui-card shadow="never">
    <div class="info-body">
      <p>宽高自定义 | 居中显示 | iframe 内容</p>
      <p style="margin-top:10px">传入参数:</p>
    </div>
  </ui-card>
  
  <div id="params" class="params-display">
    <span class="empty">（等待接收参数...）</span>
  </div>

  <div class="actions">
    <ui-button variant="primary" onclick="sendResult()"><ui-icon name="check" size="sm"></ui-icon> 返回结果并关闭</ui-button>
    <ui-button onclick="closeDialog()"><ui-icon name="x" size="sm"></ui-icon> 关闭弹窗</ui-button>
  </div>

  <script src="./_sdk/plugin-ui.js"></script>
  <script>
    let hasData = false

    // 监听主面板传来的初始数据
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'newshell:dialog-params') {
        hasData = true
        const paramsEl = document.getElementById('params')
        paramsEl.textContent = JSON.stringify(event.data.data, null, 2)
      }
    })

    // 关闭弹窗（不返回结果）
    function closeDialog() {
      parent.postMessage({ type: 'newshell:dialog-close' }, '*')
    }

    // 返回结果并关闭
    function sendResult() {
      parent.postMessage({
        type: 'newshell:dialog-close',
        result: {
          confirmed: true,
          message: '用户确认了操作',
          timestamp: Date.now()
        }
      }, '*')
    }
  </script>
</body>
</html>
