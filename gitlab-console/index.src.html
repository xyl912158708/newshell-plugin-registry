<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>GitLab 管理台</title>
<script>
document.documentElement.dataset.osTheme = 'dark'
window.__osSetTheme = function (t) { document.documentElement.dataset.osTheme = t; document.documentElement.classList.toggle('dark', t === 'dark') }
</script>
<!-- __EP_CSS__ -->
<!-- __EP_DARK_CSS__ -->
<style>
  /* ===== 换肤：Element Plus 变量 → 宿主设计令牌 =====
   * 深色变量必须挂在 html.dark 下：EP 官方暗色变量文件就是 html.dark 作用域
   * （特异性 0,1,1），写 :root（0,1,0）会被它压掉（冒烟实测）。 */
  :root {
    --el-border-radius-base: 6px;
    --el-border-radius-small: 4px;
    --el-font-family: 'DM Sans Variable', 'DM Sans', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --el-font-size-base: 13px;
    --app-on-accent: #ffffff;
    --app-code-font: 'JetBrains Mono Variable', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  html:not(.dark) {
    color-scheme: light;
    --el-color-primary: #0f766e; --el-color-primary-light-3: #579f96; --el-color-primary-light-5: #87bab3; --el-color-primary-light-7: #b7d8d3; --el-color-primary-light-8: #cfe8e4; --el-color-primary-light-9: #e7f2f0; --el-color-primary-dark-2: #0c5f58;
    --el-color-success: #15803d; --el-color-success-light-9: #e8f5ec;
    --el-color-warning: #b45309; --el-color-warning-light-9: #faf0e2;
    --el-color-danger: #dc2626; --el-color-danger-light-9: #fbe9e9;
    --el-color-info: #2563eb; --el-color-info-light-9: #e8effc;
    --el-bg-color-page: #f5f6f8; --el-bg-color: #ffffff; --el-bg-color-overlay: #ffffff;
    --el-text-color-primary: #111827; --el-text-color-regular: #4b5563; --el-text-color-secondary: #5b6b82; --el-text-color-placeholder: #8494b3;
    --el-border-color: rgba(0,0,0,.16); --el-border-color-light: rgba(0,0,0,.12); --el-border-color-lighter: rgba(0,0,0,.09); --el-border-color-extra-light: rgba(0,0,0,.05);
    --el-fill-color: #e2e6ee; --el-fill-color-light: #edf0f4; --el-fill-color-lighter: #f5f6f8; --el-fill-color-blank: #ffffff; --el-fill-color-dark: #d5dae4;
    --app-on-accent: #ffffff;
  }
  html.dark {
    color-scheme: dark;
    --el-color-primary: #2dd4bf; --el-color-primary-light-3: #35a08f; --el-color-primary-light-5: #2b7a6e; --el-color-primary-light-7: #24584f; --el-color-primary-light-8: #20453e; --el-color-primary-light-9: #1d3833; --el-color-primary-dark-2: #5eead4;
    --el-color-success: #4ade80; --el-color-success-light-9: #173325;
    --el-color-warning: #fbbf24; --el-color-warning-light-9: #3a2f14;
    --el-color-danger: #f87171; --el-color-danger-light-9: #3d1d20;
    --el-color-info: #60a5fa; --el-color-info-light-9: #1d2c47;
    --el-bg-color-page: #080b12; --el-bg-color: #0f131e; --el-bg-color-overlay: #171d2c;
    --el-text-color-primary: #e6ecf3; --el-text-color-regular: #9aa4b8; --el-text-color-secondary: #8494b3; --el-text-color-placeholder: #5f7089;
    --el-border-color: rgba(255,255,255,.13); --el-border-color-light: rgba(255,255,255,.1); --el-border-color-lighter: rgba(255,255,255,.07); --el-border-color-extra-light: rgba(255,255,255,.04);
    --el-fill-color: #1e2536; --el-fill-color-light: #171d2c; --el-fill-color-lighter: #12172a; --el-fill-color-blank: #0f131e; --el-fill-color-dark: #262f47;
    --el-disabled-bg-color: #12172a;
    --app-on-accent: #0a0f14;
  }
  html.dark .el-button--primary {
    --el-button-text-color: #0a0f14; --el-button-hover-text-color: #0a0f14; --el-button-active-text-color: #0a0f14;
  }

  /* ===== 布局 ===== */
  html, body, #app { height: 100%; }
  body { margin: 0; background: var(--el-bg-color-page); font-family: var(--el-font-family); font-size: 13px; }
  .app-root { display: flex; flex-direction: column; height: 100vh; background: var(--el-bg-color-page); color: var(--el-text-color-primary); }
  .topbar { height: 46px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--el-bg-color); border-bottom: 1px solid var(--el-border-color-lighter); }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--el-color-primary); color: var(--app-on-accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .title-block { display: flex; flex-direction: column; line-height: 1.25; }
  .title-block h1 { font-size: 14px; font-weight: 650; margin: 0; }
  .title-block .sub { font-size: 11px; color: var(--el-text-color-secondary); }
  .flex-spacer { flex: 1; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .side { width: 228px; flex: none; display: flex; flex-direction: column; background: var(--el-bg-color); border-right: 1px solid var(--el-border-color-lighter); }
  .side-head { display: flex; align-items: center; padding: 12px 12px 8px; }
  .side-title { font-size: 12px; font-weight: 600; color: var(--el-text-color-regular); }
  .side-scroll { flex: 1; }
  .conn-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin: 0 6px 3px; border-radius: 8px; cursor: pointer; }
  .conn-item:hover { background: var(--el-fill-color-light); }
  .conn-item.active { background: var(--el-color-primary-light-9); }
  .conn-avatar { width: 26px; height: 26px; border-radius: 7px; background: var(--el-fill-color); color: var(--el-color-primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 650; flex: none; }
  .conn-item.active .conn-avatar { background: var(--el-color-primary); color: var(--app-on-accent); }
  .conn-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .conn-name { font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-sub { font-size: 11px; color: var(--el-text-color-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--el-text-color-placeholder); flex: none; }
  .conn-dot.on { background: var(--el-color-success); }
  .conn-edit { opacity: 0; flex: none; }
  .conn-item:hover .conn-edit { opacity: 1; }
  .side-empty { padding: 8px 14px; font-size: 12px; line-height: 1.65; color: var(--el-text-color-secondary); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .proj-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px 0; }
  .main-tabs { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .main-tabs .el-tabs__header { margin: 4px 14px 0; }
  .main-tabs .el-tabs__content { flex: 1; overflow-y: auto; padding: 14px 18px 22px; }
  .tab-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar-hint { font-size: 12px; color: var(--el-text-color-secondary); }
  .row-list { display: flex; flex-direction: column; gap: 6px; }
  .row-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; cursor: pointer; }
  .row-item:hover { border-color: var(--el-border-color); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { display: flex; gap: 8px; font-size: 13px; font-weight: 550; }
  .row-title > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { margin-top: 2px; font-size: 11.5px; color: var(--el-text-color-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--el-text-color-secondary); }
  .mono { font-family: var(--app-code-font); font-size: 12px; }
  .detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail-title { font-size: 14px; font-weight: 650; }
  .meta-line { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--el-text-color-secondary); margin-bottom: 12px; }
  .block-label { font-size: 12px; font-weight: 600; color: var(--el-text-color-regular); margin: 16px 0 8px; }
  .empty-line { padding: 22px; text-align: center; font-size: 12.5px; color: var(--el-text-color-secondary); }
  .pane-empty { padding-top: 56px; }
  .load-more { text-align: center; padding: 10px; }
  .proj-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .proj-name { font-size: 14px; font-weight: 650; }
  .proj-desc { margin-top: 4px; font-size: 12.5px; color: var(--el-text-color-secondary); }
  .field-label { font-size: 12px; color: var(--el-text-color-secondary); }
  .crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; margin: 10px 0; }
  .crumb { color: var(--el-color-primary); cursor: pointer; }
  .crumb:hover { text-decoration: underline; }
  .crumb-sep { color: var(--el-text-color-placeholder); }
  .file-list { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; overflow: hidden; }
  .file-row { display: flex; align-items: center; gap: 9px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .file-row + .file-row { border-top: 1px solid var(--el-border-color-extra-light); }
  .file-row:hover { background: var(--el-fill-color-lighter); }
  .file-ico { color: var(--el-text-color-secondary); }
  .file-ico.dir { color: var(--el-color-warning); }
  .file-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .file-path { color: var(--el-text-color-regular); }
  .code-view, .log-view { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; padding: 12px 14px; font-family: var(--app-code-font); font-size: 12px; line-height: 1.55; overflow: auto; white-space: pre; margin: 0; }
  .log-view { max-height: 62vh; }
  .readme-block { margin-top: 16px; }
  .notes { display: flex; flex-direction: column; gap: 8px; }
  .note-item { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; padding: 9px 12px; }
  .note-head { display: flex; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .note-head .who { font-weight: 600; }
  .note-head .when { color: var(--el-text-color-secondary); }
  .comment-box { margin-top: 12px; }
  .comment-actions { text-align: right; margin-top: 8px; }
  .diff-list { display: flex; flex-direction: column; gap: 10px; }
  .diff-box { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; overflow: hidden; }
  .diff-file { padding: 7px 12px; font-size: 12px; background: var(--el-fill-color-lighter); border-bottom: 1px solid var(--el-border-color-lighter); }
  .diff-pre { margin: 0; padding: 8px 0; font-family: var(--app-code-font); font-size: 11.5px; line-height: 1.5; overflow-x: auto; }
  .dl { padding: 0 12px; white-space: pre; }
  .dl.add { background: rgba(74, 222, 128, .08); color: var(--el-color-success); }
  .dl.del { background: rgba(248, 113, 113, .08); color: var(--el-color-danger); }
  .dl.hunk { color: var(--el-color-info); }
  .dialog-foot { display: flex; align-items: center; gap: 8px; }
  .switch-line, .test-line { display: inline-flex; align-items: center; gap: 10px; }
  .hint { font-size: 12px; color: var(--el-text-color-secondary); }
  .ok-text { font-size: 12.5px; color: var(--el-color-success); }
  .err-text { font-size: 12.5px; color: var(--el-color-danger); }
  .btn-row { display: inline-flex; gap: 2px; }

  /* ===== Markdown ===== */
  .md-panel { background: var(--el-bg-color); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; padding: 12px 14px; }
  .md-body { font-size: 13px; line-height: 1.65; color: var(--el-text-color-primary); word-break: break-word; }
  .md-body p { margin: 6px 0; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { margin: 14px 0 6px; line-height: 1.35; color: var(--el-text-color-primary); }
  .md-body h1 { font-size: 19px; } .md-body h2 { font-size: 16.5px; } .md-body h3 { font-size: 14.5px; }
  .md-body a { color: var(--el-color-primary); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body code { font-family: var(--app-code-font); font-size: 12px; background: var(--el-fill-color-light); padding: 1px 5px; border-radius: 4px; }
  .md-body pre { background: var(--el-fill-color-lighter); border: 1px solid var(--el-border-color-lighter); border-radius: 8px; padding: 10px 12px; overflow: auto; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--el-border-color); color: var(--el-text-color-regular); }
  .md-body table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
  .md-body th, .md-body td { border: 1px solid var(--el-border-color-light); padding: 5px 10px; text-align: left; }
  .md-body ul, .md-body ol { margin: 6px 0; padding-left: 22px; }
  .md-body hr { border: none; border-top: 1px solid var(--el-border-color-lighter); margin: 12px 0; }
  .md-body img { max-width: 100%; }
</style>
</head>
<body>
<div id="app"></div>

</body>
</html>
