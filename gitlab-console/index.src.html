<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>GitLab 管理台</title>
<script>
document.documentElement.dataset.osTheme = 'dark'
window.__osSetTheme = function (t) { document.documentElement.dataset.osTheme = t; document.documentElement.classList.toggle('dark', t === 'dark') }
</script>

<script src="./_sdk/plugin-api.js"></script>
<script>
/* SDK 主题跟随（阶段 7 迁移）：订阅宿主主题 → 驱动现有 __osSetTheme（html.dark）。
 * 宿主 dark/light 直接映射；high-contrast 在 API SDK 侧已折算为 sdkTheme（dark 基础）。
 * 插件内手动切换（toggleTheme）保持可用：手动选择在宿主下一次切换主题前有效，
 * 之后重新跟随宿主。SDK 未加载时本段自动跳过，页面行为与迁移前一致。 */
(function () {
  var api = window.NewshellPluginApi && window.NewshellPluginApi.plugin
  if (!api || !api.theme || !window.__osSetTheme) return
  function apply(snap) {
    if (!snap || snap.stale) return
    window.__osSetTheme(snap.sdkTheme === 'light' ? 'light' : 'dark')
    // 高对比第三档：sdkTheme 只给明暗基底，原始 theme 判 HC 并打 html.hc 标记，
    // 由统一设计系统（NS-DS）的 html.hc 覆盖层提供强边框/纯色文本/高亮主色。
    document.documentElement.classList.toggle('hc', snap.theme === 'high-contrast')
  }
  apply(api.theme.get())
  api.theme.onChange(apply)
  window.addEventListener('load', function () { apply(api.theme.get()) })
})()
</script>

<style>
/* ============================================================================
 * NewShell 插件统一设计系统 · NS-DS v1（2026-11-22）
 * 源文件：shared/design-system.css —— 四个 EP 插件共用同一份，禁止各插件私改。
 * 同步方式：python3 sync_design_system.py（把本文件注入各插件 index.src.html
 * 的 NS-DS 标记段，位于插件自有 <style> 之后，靠层叠顺序覆盖旧样式）。
 * 设计原则（对齐宿主与用户既定品味）：
 *   现代、安静、专业；中性分层表面，不用大面积渐变/玻璃模糊/夸张投影；
 *   层级靠「页头区 / 上下文栏 / 内容区 / 状态栏」四段结构 + 表面明暗差表达，
 *   不靠装饰。颜色一律消费 Element Plus 变量（随宿主主题令牌切换明暗）。
 * 结构约定（四个插件必须一致）：
 *   .topbar 52px 页头 → .layout（.side 240px 导航 + .main）
 *   .main 内：上下文栏（.proj-bar/.toolbar/.crumbs）→ 分段式页签（.main-tabs）
 *   → 工具栏（.tab-toolbar）→ 内容 → .ns-statusbar 状态栏 30px。
 * ========================================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root {
  --ns-space-1: 4px; --ns-space-2: 8px; --ns-space-3: 12px;
  --ns-space-4: 16px; --ns-space-5: 20px; --ns-space-6: 24px;
  --ns-radius-s: 8px; --ns-radius-m: 10px; --ns-radius-l: 12px; --ns-radius-xl: 14px;
  --ns-font-caption: 11.5px; --ns-font-body: 13px; --ns-font-title: 14.5px; --ns-font-display: 17px;
  --ns-ease: cubic-bezier(.2, .7, .3, 1);
  --ns-duration: 140ms;
  --ns-surface-page: var(--el-bg-color-page);
  --ns-surface-card: var(--el-bg-color);
  --ns-surface-inset: var(--el-fill-color-lighter);
  --ns-surface-hover: var(--el-fill-color-light);
  --ns-border: var(--el-border-color-lighter);
  --ns-border-strong: var(--el-border-color-light);
  --ns-ring: 0 0 0 3px color-mix(in srgb, var(--el-color-primary) 22%, transparent);
}
html:not(.dark) {
  --ns-shadow-1: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .04);
  --ns-shadow-2: 0 8px 24px rgba(16, 24, 40, .12), 0 2px 6px rgba(16, 24, 40, .08);
  --ns-side-bg: color-mix(in srgb, var(--el-bg-color) 55%, var(--el-bg-color-page));
}
html.dark {
  --ns-shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
  --ns-shadow-2: 0 10px 28px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .4);
  --ns-side-bg: color-mix(in srgb, var(--el-bg-color) 45%, var(--el-bg-color-page));
}

/* ---------- 2. 基础细节 ---------- */
body { letter-spacing: .01em; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: color-mix(in srgb, var(--el-color-primary) 28%, transparent); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--el-border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--el-text-color-placeholder); }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--el-color-primary); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ---------- 3. 页头（层级第一段） ---------- */
.app-root .topbar {
  height: 52px; padding: 0 var(--ns-space-4); gap: var(--ns-space-3);
  background: var(--ns-surface-card); box-shadow: var(--ns-shadow-1);
  border-bottom: 1px solid var(--ns-border); position: relative; z-index: 20;
}
.app-root .topbar .logo {
  width: 32px; height: 32px; border-radius: var(--ns-radius-m);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--app-on-accent) 18%, transparent);
}
.app-root .topbar .title-block h1 { font-size: var(--ns-font-title); font-weight: 680; letter-spacing: .01em; }
.app-root .topbar .title-block .sub { font-size: var(--ns-font-caption); margin-top: 1px; }
.ns-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: var(--ns-font-caption); font-weight: 550; white-space: nowrap;
  color: var(--el-text-color-regular); background: var(--ns-surface-inset);
  border: 1px solid var(--ns-border);
}
.ns-pill .ns-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--el-text-color-placeholder); flex: none; }
.ns-pill .ns-dot.on { background: var(--el-color-success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--el-color-success) 20%, transparent); }

/* ---------- 4. 侧栏导航（工具导航现代化） ---------- */
.app-root .layout .side {
  width: 240px; background: var(--ns-side-bg);
  border-right: 1px solid var(--ns-border); padding-bottom: var(--ns-space-2);
}
.app-root .side-head { padding: 14px 14px 8px; }
.app-root .side-title {
  font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
  color: var(--el-text-color-secondary);
}
.app-root .side-scroll .el-scrollbar__wrap { padding-right: 2px; }
.app-root .conn-item, .app-root .bucket-item {
  min-height: 40px; margin: 0 8px 2px; padding: 7px 10px;
  border-radius: var(--ns-radius-m); border: 1px solid transparent;
  transition: background var(--ns-duration) var(--ns-ease), border-color var(--ns-duration) var(--ns-ease), box-shadow var(--ns-duration) var(--ns-ease);
}
.app-root .conn-item:hover, .app-root .bucket-item:hover { background: var(--ns-surface-hover); }
.app-root .conn-item.active, .app-root .bucket-item.active {
  background: var(--el-color-primary-light-9); border-color: var(--ns-border);
  box-shadow: inset 3px 0 0 var(--el-color-primary);
}

/* ---------- 9.6 高对比第三档（html.hc） ----------
 * 宿主 theme=high-contrast 时，各插件主题跟随片段给 <html> 打 .hc 标记
 * （基底仍为 dark：sdkTheme 折算）。此处在 dark 令牌之上叠加 HC 覆盖：
 * 主色对齐宿主 HC 令牌 #00ffff、边框大幅提强、文本纯白、焦点环加粗。
 * 与 html.dark 同特异性，靠本段在样式表中的靠后位置生效。 */
html.hc {
  --el-color-primary: #00ffff;
  --el-color-primary-light-3: #00c9c9; --el-color-primary-light-5: #009a9a;
  --el-color-primary-light-7: #006b6b; --el-color-primary-light-8: #004d4d;
  --el-color-primary-light-9: #06333a; --el-color-primary-dark-2: #66ffff;
  --el-text-color-primary: #ffffff; --el-text-color-regular: #eef2f8;
  --el-text-color-secondary: #c3cede; --el-text-color-placeholder: #93a5bd;
  --el-border-color: rgba(255, 255, 255, .55); --el-border-color-light: rgba(255, 255, 255, .45);
  --el-border-color-lighter: rgba(255, 255, 255, .35); --el-border-color-extra-light: rgba(255, 255, 255, .2);
  --accent-color: #00ffff; --border-color: rgba(255, 255, 255, .45);
  --ns-ring: 0 0 0 3px rgba(0, 255, 255, .45);
}
html.hc .el-button--primary {
  --el-button-text-color: #000000; --el-button-hover-text-color: #000000; --el-button-active-text-color: #000000;
  font-weight: 650;
}
html.hc :focus-visible { outline: 3px solid #00ffff; outline-offset: 2px; }
html.hc .app-root .conn-item.active, html.hc .app-root .bucket-item.active,
html.hc .app-root .nav-item.active { box-shadow: inset 4px 0 0 #00ffff; }
html.hc .app-root .main-tabs .el-tabs__item.is-active { box-shadow: inset 0 0 0 2px #00ffff; }
