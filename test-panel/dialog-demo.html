<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Dialog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary, #1e1e2e);
    color: var(--text-primary, #cdd6f4);
    display: flex; flex-direction: column;
    align-items: center;
    min-height: 100%; padding: 20px; gap: 16px;
    overflow: hidden;
  }
  h2 { font-size: 16px; color: var(--accent-color, #89b4fa); }
  .card {
    background: var(--bg-secondary, #313244);
    border: 1px solid var(--border-color, #45475a);
    border-radius: 10px; padding: 20px; text-align: center;
    max-width: 400px; width: 100%;
  }
  .card p { font-size: 13px; color: var(--text-secondary, #a6adc8); margin: 4px 0; }
  button {
    padding: 10px 24px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
  }
  .btn-ok { background: var(--accent-color, #89b4fa); color: #1e1e2e; }
  .btn-ok:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(137,180,250,0.3); }
  .btn-cancel { background: var(--bg-tertiary, #45475a); color: var(--text-primary, #cdd6f4); border: 1px solid var(--border-color, #585b70); margin-left: 10px; }
  .btn-cancel:hover { background: var(--danger-color, #f38ba8); color: #fff; }
  #params {
    background: var(--bg-tertiary, #45475a); border-radius: 6px;
    padding: 10px; font-size: 11px; font-family: Consolas, monospace;
    white-space: pre-wrap; max-width: 400px; width: 100%;
    color: var(--text-secondary, #a6adc8);
    word-break: break-all;
  }
  .empty { color: var(--text-muted, #6c7086); font-style: italic; }
</style>
</head>
<body>
  <h2>🧪 Test-Panel 弹窗</h2>
  <div class="card">
    <p>宽高自定义 | 居中显示 | 接收参数</p>
  </div>
  <div id="params"><span class="empty">（等待接收参数...）</span></div>
  <div>
    <button class="btn-ok" onclick="sendResult()">✅ 确认并返回结果</button>
    <button class="btn-cancel" onclick="closeDialog()">✕ 取消</button>
  </div>
  <script>
    function reportHeight() {
      const h = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      )
      parent.postMessage({ type: 'newshell:dialog-resize', height: h }, '*')
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'newshell:dialog-params') {
        document.getElementById('params').textContent = JSON.stringify(e.data.data, null, 2)
        setTimeout(reportHeight, 0)
      }
      if (e.data?.type === 'newshell:dialog-measure') {
        reportHeight()
      }
    })

    setTimeout(reportHeight, 100)
    if (window.ResizeObserver) {
      new ResizeObserver(() => reportHeight()).observe(document.body)
    }

    function closeDialog() {
      parent.postMessage({ type: 'newshell:dialog-close' }, '*')
    }
    function sendResult() {
      parent.postMessage({
        type: 'newshell:dialog-close',
        result: { confirmed: true, message: '测试完成', timestamp: Date.now() }
      }, '*')
    }
  </script>
</body>
</html>
