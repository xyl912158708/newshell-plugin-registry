<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary, #1e1e2e);
    color: var(--text-primary, #cdd6f4);
    padding: 16px;
    overflow-y: auto;
  }
  h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent-color, #89b4fa); }
  .card {
    background: var(--bg-secondary, #313244);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 12px;
    line-height: 1.6;
  }
  .card .label { color: var(--text-muted, #6c7086); }
  .card .value { color: var(--text-primary, #cdd6f4); word-break: break-all; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: rgba(137, 180, 250, 0.15);
    color: #89b4fa;
  }
  /* 滚动条 — 与主应用统一样式 */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
  <h3>🧪 左侧面板测试</h3>
  <div class="card">
    <span class="label">插件ID：</span>
    <span class="value">test-panel</span>
  </div>
  <div class="card">
    <span class="label">标签ID：</span>
    <span class="value">test-left</span>
  </div>
  <div class="card">
    <span class="badge">SidePanel</span>
    <span style="margin-left:8px;font-size:12px;color:var(--text-muted, #6c7086);">
      此内容来自插件渲染的 iframe
    </span>
  </div>
</body>
</html>
