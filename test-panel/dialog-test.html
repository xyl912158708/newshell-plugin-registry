<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary, #1e1e2e);
    color: var(--text-primary, #cdd6f4);
    padding: 14px; overflow-y: auto;
  }
  h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent-color, #89b4fa); }
  .btn-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  button {
    padding: 10px 14px; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
    text-align: left; width: 100%;
  }
  .btn-sm { background: var(--bg-tertiary, #313244); color: var(--text-primary, #cdd6f4); border: 1px solid var(--border-color, #45475a); }
  .btn-md { background: var(--bg-secondary, #45475a); color: var(--text-primary, #cdd6f4); border: 1px solid var(--accent-color, #89b4fa); }
  .btn-lg { background: var(--accent-color, #89b4fa); color: #1e1e2e; }
  button:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(137,180,250,0.2); }
  .result-area {
    padding: 10px;
    background: var(--bg-secondary, #313244);
    border: 1px solid var(--border-color, #45475a);
    border-radius: 8px; font-size: 11px;
    font-family: Consolas, monospace;
    color: var(--text-secondary, #a6adc8);
    white-space: pre-wrap; max-height: 180px; overflow-y: auto;
  }
  .empty { color: var(--text-muted, #6c7086); font-style: italic; }
</style>
</head>
<body>
  <h3>💬 弹窗测试</h3>
  <div class="btn-row">
    <button class="btn-sm" onclick="showDialog(400, 260, '📦 小弹窗 400×260')">📦 小弹窗 (400×260)</button>
    <button class="btn-md" onclick="showDialog(550, 360, '📋 中弹窗 550×360')">📋 中弹窗 (550×360)</button>
    <button class="btn-lg" onclick="showDialog(700, 420, '🖥 大弹窗 700×420')">🖥 大弹窗 (700×420)</button>
    <button class="btn-sm" onclick="showDialogWithData()">📊 带数据弹窗</button>
  </div>
  <div class="result-area" id="result"><span class="empty">点击上方按钮触发弹窗…</span></div>

  <script>
    function showDialog(width, height, title) {
      parent.postMessage({
        type: 'newshell:dialog-trigger',
        title: title,
        width: width,
        height: height,
        renderer: 'dialog-demo.html',
        data: { source: 'dialog-test-tab', width, height }
      }, '*')
      document.getElementById('result').textContent =
        '已触发弹窗: ' + width + '×' + height
    }

    function showDialogWithData() {
      parent.postMessage({
        type: 'newshell:dialog-trigger',
        title: '📊 带数据弹窗',
        width: 550, height: 380,
        renderer: 'dialog-demo.html',
        data: {
          source: 'dialog-test-tab',
          userId: 1001,
          userName: 'Alice',
          roles: ['admin', 'editor'],
          permissions: { canRead: true, canWrite: true, canDelete: false }
        }
      }, '*')
      document.getElementById('result').textContent =
        '已触发弹窗（含嵌套数据）'
    }
  </script>
</body>
</html>
