<style>
  /* ===== 设计 token（映射 Pico 变量，深/浅跟随应用外观） ===== */
  /* 注意：Pico 的深色变量只在 [data-theme="dark"] 或 :root:not([data-theme]) +

  :root {
    color-scheme: dark;
    --bg-primary: #13171f;
    --bg-secondary: #1c212c;
    --bg-tertiary: #262d3b;
    --text-primary: #e4e8ef;

    --accent-color: #89b4fa;
    --border-color: #39415a;

  @media (prefers-color-scheme: light) {

      color-scheme: light;
      --bg-primary: #ffffff;
      --bg-secondary: #f4f5f7;
      --bg-tertiary: #e8eaee;
      --text-primary: #1f2430;
      --text-secondary: #5b6472;
      --text-muted: #828da0;
      --accent-color: #2563eb;
      --border-color: #d4d9e0;
    }
  }
  /* Pico 控件色板在 .pico 作用域内跟随媒体查询切换（宿主为 Electron，

    --pico-form-element-spacing-vertical: 0.42rem;
    --pico-form-element-spacing-horizontal: 0.65rem;
    --pico-background-color: #13171f;
    --pico-color: #e4e8ef;
    --pico-h1-color: #e4e8ef; --pico-h2-color: #e4e8ef; --pico-h3-color: #e4e8ef; --pico-h4-color: #e4e8ef; --pico-h5-color: #e4e8ef; --pico-h6-color: #e4e8ef;
    --pico-muted-color: #9aa5b5;
    --pico-muted-border-color: #2a3140;
    --pico-card-background-color: #1c212c;
    --pico-card-border-color: #39415a;
    --pico-dropdown-hover-background-color: #262d3b;
    --pico-form-element-background-color: #171b24;
    --pico-form-element-border-color: #39415a;
    --pico-form-element-color: #e4e8ef;
    --pico-form-element-placeholder-color: #79849a;
    --pico-form-element-active-background-color: #171b24;
    --pico-form-element-active-border-color: #89b4fa;
    --pico-form-element-focus-color: color-mix(in srgb, #89b4fa 55%, transparent);
    --pico-switch-background-color: #39415a;
    --pico-primary-background: #89b4fa; --pico-primary-border: #89b4fa;
    --pico-primary-hover-background: #a5c8fc; --pico-primary-hover-border: #a5c8fc;
    --pico-primary-focus: color-mix(in srgb, #89b4fa 55%, transparent);
    --pico-primary: #11111b; --pico-primary-hover: #11111b; --pico-primary-inverse: #11111b;
    --pico-h1-color: #e4e8ef; --pico-h2-color: #e4e8ef; --pico-h3-color: #e4e8ef; --pico-h4-color: #e4e8ef; --pico-h5-color: #e4e8ef; --pico-h6-color: #e4e8ef;
  }
  @media (prefers-color-scheme: light) {
    .pico {
      --pico-background-color: #ffffff;
      --pico-color: #1f2430;
      --pico-h1-color: #1f2430; --pico-h2-color: #1f2430; --pico-h3-color: #1f2430; --pico-h4-color: #1f2430; --pico-h5-color: #1f2430; --pico-h6-color: #1f2430;
      --pico-muted-color: #5b6472;
      --pico-muted-border-color: #e8eaee;
      --pico-card-background-color: #f4f5f7;
      --pico-card-border-color: #d4d9e0;
      --pico-dropdown-hover-background-color: #e8eaee;
      --pico-form-element-background-color: #ffffff;
      --pico-form-element-border-color: #d4d9e0;
      --pico-form-element-color: #1f2430;
      --pico-form-element-placeholder-color: #828da0;
      --pico-form-element-active-background-color: #ffffff;
      --pico-form-element-active-border-color: #2563eb;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  #app { height: 100%; display: flex; flex-direction: column; }
  body {
    height: 100vh; overflow: hidden;

    font-size: 13px; padding: 14px 16px 22px; -webkit-font-smoothing: antialiased;
  }

   * 全部 token 以该属性为准（!特异性高于媒体查询块），根治宿主与系统外观不一致。 */

    --bg-primary: #13171f; --bg-secondary: #1c212c; --bg-tertiary: #262d3b;
    --text-primary: #e4e8ef; --text-secondary: #9aa5b5; --text-muted: #79849a;

  }

    --pico-muted-color: #9aa5b5; --pico-muted-border-color: #2a3140;
    --pico-card-background-color: #1c212c; --pico-card-border-color: #39415a;
    --pico-dropdown-hover-background-color: #262d3b;
    --pico-form-element-background-color: #171b24; --pico-form-element-border-color: #39415a;
    --pico-form-element-color: #e4e8ef; --pico-form-element-placeholder-color: #79849a;
    --pico-form-element-active-background-color: #171b24; --pico-form-element-active-border-color: #89b4fa;
    --pico-form-element-focus-color: color-mix(in srgb, #89b4fa 55%, transparent);
    --pico-switch-background-color: #39415a;
    --pico-primary-background: #89b4fa; --pico-primary-border: #89b4fa;
    --pico-primary-hover-background: #a5c8fc; --pico-primary-hover-border: #a5c8fc;

    --pico-background-color: #ffffff; --pico-color: #1f2430;

    --pico-muted-color: #5b6472; --pico-muted-border-color: #e8eaee;
    --pico-card-background-color: #f4f5f7; --pico-card-border-color: #d4d9e0;
    --pico-dropdown-hover-background-color: #e8eaee;
    --pico-form-element-background-color: #ffffff; --pico-form-element-border-color: #d4d9e0;
    --pico-form-element-color: #1f2430; --pico-form-element-placeholder-color: #828da0;
    --pico-form-element-active-background-color: #ffffff; --pico-form-element-active-border-color: #2563eb;
    --pico-form-element-focus-color: color-mix(in srgb, #2563eb 45%, transparent);
    --pico-primary-background: #2563eb; --pico-primary-border: #2563eb;
    --pico-primary-hover-background: #1d4ed8; --pico-primary-hover-border: #1d4ed8;
    --pico-primary-focus: color-mix(in srgb, #2563eb 45%, transparent);
    --pico-primary: #ffffff; --pico-primary-hover: #ffffff; --pico-primary-inverse: #ffffff;
    --pico-h1-color: #1f2430; --pico-h2-color: #1f2430; --pico-h3-color: #1f2430; --pico-h4-color: #1f2430; --pico-h5-color: #1f2430; --pico-h6-color: #1f2430;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; border: 2px solid var(--bg-primary); }
  button { font: inherit; cursor: pointer; }
  input, select { font: inherit; }
  input[type="checkbox"] { accent-color: var(--accent-color); width: 14px; height: 14px; cursor: pointer; margin: 0; }
  .pico .btn {

  }

  .pico .btn.danger { background: #f38ba8; border-color: #f38ba8; color: #11111b; }
  .pico .btn.danger:hover { background: #f5a3bd; border-color: #f5a3bd; }

  .layout { display: flex; gap: 14px; align-items: stretch; flex: 1; min-height: 0; }
  .side { width: 252px; flex: none; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .side-box {
    background: var(--bg-secondary); border: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent);
    border-radius: 10px; padding: 10px;
  }
  .side-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 0 2px 8px; }

  .conn-item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; }
  .conn-item:hover { background: var(--bg-tertiary); }
  .conn-item.active { background: var(--bg-tertiary); border-color: color-mix(in srgb, var(--border-color) 60%, transparent); box-shadow: inset 2px 0 0 var(--accent-color); }
  .conn-avatar { width: 30px; height: 30px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .conn-meta { flex: 1; min-width: 0; }
  .conn-name { display: block; font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-sub { display: block; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #a6e3a1; flex: none; }
  .conn-item .icon-btn { opacity: 0; flex: none; }
  .conn-item:hover .icon-btn, .conn-item.active .icon-btn { opacity: 1; }
  .form-row label.check-row { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text-primary); cursor: pointer; }

  .bucket-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); }
  .bucket-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  .bucket-item.active { background: var(--bg-tertiary); color: var(--text-primary); box-shadow: inset 2px 0 0 var(--accent-color); }
  .bucket-item svg { width: 14px; height: 14px; flex: none; opacity: .8; }
  .bucket-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .bucket-join { display: flex; gap: 6px; margin-top: 9px; }
  .bucket-join input { margin-bottom: 0; }
  .empty-hint { color: var(--text-muted); font-size: 12px; padding: 4px 2px; line-height: 1.65; }
  .tip-text { color: var(--text-muted); font-size: 11.5px; line-height: 1.7; padding: 0 2px; }
  .text-input { background: var(--bg-primary); margin-bottom: 0; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; min-height: 26px; }
  .crumbs .crumb { padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--accent-color); font-weight: 550; }
  .crumbs .crumb:hover { background: var(--bg-tertiary); }

  .list-wrap { border: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent); border-radius: 10px; overflow: hidden; background: var(--bg-secondary); display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .list-head, .row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 96px 158px 128px; align-items: center; padding: 0 10px; column-gap: 8px; }

  @media (max-width: 880px) {

  }
  .list-head { height: 34px; font-size: 12px; color: var(--text-secondary); font-weight: 550; border-bottom: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent); background: var(--bg-primary); }

  .row.selected { background: color-mix(in srgb, var(--accent-color) 13%, transparent); }
  .row .name { display: flex; align-items: center; gap: 9px; overflow: hidden; white-space: nowrap; }
  .row .fname { overflow: hidden; text-overflow: ellipsis; }

  .file-tile.dir { color: var(--accent-color); background: color-mix(in srgb, var(--accent-color) 13%, transparent); }
