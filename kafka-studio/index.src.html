  .md-body code { background: var(--bg-primary); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .md-body pre code { display: block; padding: 10px; overflow-x: auto; }
  .md-body a { color: var(--accent-color); }
  .md-body table { border-collapse: collapse; margin: 8px 0; }
  .md-body td, .md-body th { border: 1px solid var(--border-color); padding: 4px 9px; }
  #glCanvas { width: 100%; height: 56vh; background: #0f131e; border-radius: 8px; touch-action: none; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid color-mix(in srgb, var(--border-color) 70%, transparent);
    padding: 8px 16px; border-radius: 8px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 99;
    max-width: 80vw; white-space: pre-wrap; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .no-session { padding: 60px 30px; text-align: center; }
  .no-session .big { font-size: 17px; font-weight: 650; margin-bottom: 10px; }
  .no-session p { color: var(--text-secondary); line-height: 1.8; }
  .no-session code { background: var(--bg-secondary); padding: 1px 6px; border-radius: 4px; }

  /* ===== Kafka Studio 专用 ===== */
  .gl-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pico .gl-tab { padding: 5px 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--border-color) 65%, transparent); background: transparent; color: var(--text-primary); font-size: 12.5px; cursor: pointer; box-shadow: none; margin: 0; width: auto; }
  .pico .gl-tab:hover { background: var(--bg-tertiary); }
  .pico .gl-tab.active { background: var(--accent-color); border-color: var(--accent-color); color: #0a0f14; font-weight: 600; }

  .kv-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .kv-table td, .kv-table th { border-bottom: 1px solid color-mix(in srgb, var(--border-color) 40%, transparent); padding: 6px 8px; text-align: left; vertical-align: top; }
  .kv-table th { color: var(--text-secondary); font-weight: 600; font-size: 11.5px; }
  .kv-table tr.clickable { cursor: pointer; }
  .kv-table tr.clickable:hover td { background: var(--bg-tertiary); }
  .mono { font-family: var(--font-mono); }
  .rec-item { border: 1px solid color-mix(in srgb, var(--border-color) 45%, transparent); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .rec-head { display: flex; gap: 10px; align-items: center; padding: 7px 12px; cursor: pointer; background: var(--bg-secondary); font-size: 12px; flex-wrap: wrap; }
  .rec-head:hover { background: var(--bg-tertiary); }
  .rec-body { padding: 10px 12px; border-top: 1px solid color-mix(in srgb, var(--border-color) 40%, transparent); }
  .rec-body pre { white-space: pre-wrap; word-break: break-all; font-family: var(--font-mono); font-size: 12px; margin: 4px 0 10px; background: var(--bg-primary); border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow: auto; }
  .badge { display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, #4ade80 22%, transparent); color: #4ade80; }
  :root[data-os-theme="light"] .badge { color: #15803d; }
  .badge.warn { background: color-mix(in srgb, #fbbf24 25%, transparent); color: #fbbf24; }
  :root[data-os-theme="light"] .badge.warn { color: #b45309; }
  .code-view { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--bg-primary); border-radius: 8px; padding: 12px 14px; max-height: 520px; overflow: auto; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #8494b3; flex: none; }
  .conn-dot.on { background: #4ade80; }


  /* ===== 精修层：对齐宿主 NewShell 设计语言（青绿强调 / 紧凑密度 / 发丝线） ===== */
  :root { --danger-color: #f87171; --success-color: #4ade80; --warning-color: #fbbf24; --info-color: #60a5fa; }
  :root[data-os-theme="light"] { --danger-color: #dc2626; --success-color: #15803d; --warning-color: #b45309; --info-color: #2563eb; }
  body { font-family: 'DM Sans Variable', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif; }
  .mono, code, kbd { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, 'Microsoft YaHei', monospace; }
  .pico .btn { height: 30px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; line-height: 1; font-weight: 550; flex: none; box-shadow: none; transition: background-color .15s cubic-bezier(.4, 0, .2, 1), border-color .15s cubic-bezier(.4, 0, .2, 1), color .15s cubic-bezier(.4, 0, .2, 1); }
  .pico .btn.small { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .pico .btn.danger { background: color-mix(in srgb, var(--danger-color) 13%, transparent); border-color: color-mix(in srgb, var(--danger-color) 32%, transparent); color: var(--danger-color); }
  .pico .btn.danger:hover { background: color-mix(in srgb, var(--danger-color) 22%, transparent); border-color: color-mix(in srgb, var(--danger-color) 45%, transparent); color: var(--danger-color); }
  .pico .gl-tab { height: 28px; padding: 0 13px; display: inline-flex; align-items: center; flex: none; transition: background-color .15s, color .15s, border-color .15s; }
  .pico .gl-tab.active { background: color-mix(in srgb, var(--accent-color) 14%, transparent); border-color: color-mix(in srgb, var(--accent-color) 42%, transparent); color: var(--accent-color); }
  :root[data-os-theme="light"] .pico .gl-tab.active { color: var(--accent-color); }
  .pico .nav-item.active { background: color-mix(in srgb, var(--accent-color) 12%, transparent); border-color: color-mix(in srgb, var(--accent-color) 35%, transparent); color: var(--accent-color); }
  .conn-item.active { background: color-mix(in srgb, var(--accent-color) 9%, transparent); }
  .bucket-item.active { background: color-mix(in srgb, var(--accent-color) 12%, transparent); color: var(--accent-color); }
  .pico input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), .pico select { height: 32px; padding-top: 0; padding-bottom: 0; border-radius: 6px; font-size: 13px; }
  .pico textarea { border-radius: 6px; font-size: 13px; }
  .pico .icon-btn { flex: none; }
