<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoShell 管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary, #1e1e1e);
      color: var(--text-primary, #e0e0e0);
      padding: 24px;
      line-height: 1.6;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-muted, #888);
      margin-bottom: 24px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-secondary, #252526);
      border: 1px solid var(--border-color, #333);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: var(--accent-color, #2dd4bf);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.1);
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted, #888);
      margin-bottom: 4px;
    }
    .form-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      background: var(--bg-tertiary, #1e1e1e);
      border: 1px solid var(--border-color, #333);
      border-radius: 6px;
      color: var(--text-primary, #e0e0e0);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent-color, #2dd4bf);
      box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.15);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      background: var(--accent-color, #2dd4bf);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: var(--bg-tertiary, #333);
      color: var(--text-primary, #e0e0e0);
      border: 1px solid var(--border-color, #444);
    }
    .btn-secondary:hover {
      background: var(--bg-hover, #3c3c3c);
      border-color: var(--accent-color, #2dd4bf);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .info-text {
      font-size: 12px;
      color: var(--text-muted, #888);
      margin-top: 8px;
    }
    .status-text {
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }
    .status-success { color: #4ade80; }
    .status-error { color: #f87171; }
    .status-info { color: #60a5fa; }
    .server-file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-tertiary, #1e1e1e);
      border: 1px solid var(--border-color, #333);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .server-file-name {
      font-size: 13px;
      font-weight: 500;
    }
    .server-file-arch {
      font-size: 11px;
      color: var(--text-muted, #888);
      background: var(--bg-secondary, #333);
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }
    .divider {
      height: 1px;
      background: var(--border-color, #333);
      margin: 16px 0;
    }
    .file-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .file-input-row .form-input {
      flex: 1;
    }
    .file-input-row .btn {
      flex-shrink: 0;
    }
    /* 滚动条 */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
    ::-webkit-scrollbar-corner { background: transparent; }
  </style>
</head>
<body>
  <h2>🐹 GoShell 管理面板</h2>
  <p class="subtitle">配置连接信息、下载服务端程序、执行文件传输</p>

  <div class="card-grid">
    <!-- 配置卡片 -->
    <div class="card">
      <div class="card-title">⚙️ 连接配置</div>
      <div class="form-group">
        <label class="form-label">服务器地址</label>
        <input type="text" class="form-input" id="host" placeholder="192.168.3.67" value="192.168.3.67">
      </div>
      <div class="form-group">
        <label class="form-label">端口</label>
        <input type="number" class="form-input" id="port" placeholder="8080" value="8080">
      </div>
      <div class="form-group">
        <label class="form-label">认证令牌 (Token)</label>
        <input type="password" class="form-input" id="token" placeholder="kedacom123" value="kedacom123">
      </div>
      <div class="btn-row">
        <button class="btn" onclick="saveConfig()">保存配置</button>
        <button class="btn btn-secondary" onclick="testConnection()">测试连接</button>
      </div>
      <div class="status-text" id="configStatus"></div>
    </div>

    <!-- 下载服务器包卡片 -->
    <div class="card">
      <div class="card-title">📦 下载服务端启动包</div>
      <p class="info-text">将插件内置的服务端程序保存到本地，随后可上传到 Linux 服务器运行。</p>
      <div class="server-file-item">
        <div>
          <span class="server-file-name">goshell-v6-linux-amd64</span>
          <span class="server-file-arch">x86_64</span>
        </div>
        <button class="btn btn-secondary" onclick="downloadServer('amd64')">下载</button>
      </div>
      <div class="server-file-item">
        <div>
          <span class="server-file-name">goshell-v6-linux-arm64</span>
          <span class="server-file-arch">ARM64</span>
        </div>
        <button class="btn btn-secondary" onclick="downloadServer('arm64')">下载</button>
      </div>
      <div class="status-text" id="downloadStatus"></div>
    </div>

    <!-- 文件传输卡片 -->
    <div class="card">
      <div class="card-title">📤 上传文件到服务器</div>
      <div class="form-group">
        <label class="form-label">本地文件</label>
        <div class="file-input-row">
          <input type="text" class="form-input" id="uploadLocalPath" placeholder="点击右侧按钮选择文件" readonly>
          <button class="btn btn-secondary" onclick="selectUploadFile()">选择</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">远程路径</label>
        <input type="text" class="form-input" id="uploadRemotePath" placeholder="/tmp/file.txt">
      </div>
      <div class="btn-row">
        <button class="btn" onclick="uploadFile()">开始上传</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted,#888);cursor:pointer;">
          <input type="checkbox" id="uploadMkdir" style="cursor:pointer;"> 自动创建目录
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted,#888);cursor:pointer;">
          <input type="checkbox" id="uploadOverwrite" style="cursor:pointer;"> 覆盖已存在
        </label>
      </div>
      <div class="status-text" id="uploadStatus"></div>

      <div class="divider"></div>

      <div class="card-title">📥 从服务器下载文件</div>
      <div class="form-group">
        <label class="form-label">远程路径</label>
        <input type="text" class="form-input" id="downloadRemotePath" placeholder="/tmp/file.txt">
      </div>
      <div class="form-group">
        <label class="form-label">保存位置</label>
        <div class="file-input-row">
          <input type="text" class="form-input" id="downloadLocalPath" placeholder="点击右侧按钮选择保存位置" readonly>
          <button class="btn btn-secondary" onclick="selectDownloadPath()">选择</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="downloadFile()">开始下载</button>
      </div>
      <div class="status-text" id="downloadFileStatus"></div>
    </div>
  </div>

  <script>
    // ========== 工具函数 ==========
    let requestIdCounter = 0
    const pendingRequests = new Map()

    function sendRequest(action, payload) {
      return new Promise((resolve, reject) => {
        const requestId = ++requestIdCounter
        pendingRequests.set(requestId, { resolve, reject })
        parent.postMessage({
          type: 'newshell:plugin-action',
          action,
          payload,
          requestId
        }, '*')
      })
    }

    window.addEventListener('message', (event) => {
      if (!event.data) return
      if (event.data.type === 'newshell:plugin-action-response') {
        const { requestId, result, error } = event.data
        const pending = pendingRequests.get(requestId)
        if (!pending) return
        pendingRequests.delete(requestId)
        if (error) {
          pending.reject(new Error(error))
        } else {
          pending.resolve(result)
        }
      }
      if (event.data.type === 'newshell:params') {
        // 收到初始参数（如有）
      }
    })

    function setStatus(id, text, type = 'info') {
      const el = document.getElementById(id)
      if (!el) return
      el.textContent = text
      el.className = 'status-text status-' + type
    }

    function getConfig() {
      return {
        host: document.getElementById('host').value.trim(),
        port: parseInt(document.getElementById('port').value) || 8080,
        token: document.getElementById('token').value.trim()
      }
    }

    // ========== 配置操作 ==========
    async function saveConfig() {
      const config = getConfig()
      if (!config.host) {
        setStatus('configStatus', '请输入服务器地址', 'error')
        return
      }
      try {
        await sendRequest('save-config', config)
        setStatus('configStatus', '配置已保存', 'success')
      } catch (e) {
        setStatus('configStatus', '保存失败: ' + e.message, 'error')
      }
    }

    async function testConnection() {
      const config = getConfig()
      if (!config.host) {
        setStatus('configStatus', '请输入服务器地址', 'error')
        return
      }
      setStatus('configStatus', '正在测试连接...', 'info')
      try {
        const result = await sendRequest('test-connection', config)
        if (result.success) {
          setStatus('configStatus', '连接成功', 'success')
        } else {
          setStatus('configStatus', '连接失败: ' + (result.error || '未知错误'), 'error')
        }
      } catch (e) {
        setStatus('configStatus', '测试失败: ' + e.message, 'error')
      }
    }

    async function loadConfig() {
      try {
        const config = await sendRequest('get-config', {})
        if (config) {
          if (config.host) document.getElementById('host').value = config.host
          if (config.port) document.getElementById('port').value = config.port
          if (config.token) document.getElementById('token').value = config.token
        }
      } catch (e) {
        console.error('加载配置失败:', e)
      }
    }

    // ========== 下载服务端 ==========
    async function downloadServer(arch) {
      const statusId = 'downloadStatus'
      setStatus(statusId, '正在准备下载...', 'info')
      try {
        const result = await sendRequest('download-server', { arch })
        if (result.success) {
          setStatus(statusId, '已保存到: ' + result.filePath, 'success')
        } else if (result.canceled) {
          setStatus(statusId, '用户取消', 'info')
        } else {
          setStatus(statusId, '下载失败: ' + (result.error || '未知错误'), 'error')
        }
      } catch (e) {
        setStatus(statusId, '下载失败: ' + e.message, 'error')
      }
    }

    // ========== 上传文件 ==========
    async function selectUploadFile() {
      try {
        const result = await sendRequest('select-open-file', {})
        if (result.filePaths && result.filePaths.length > 0) {
          document.getElementById('uploadLocalPath').value = result.filePaths[0]
        }
      } catch (e) {
        console.error('选择文件失败:', e)
      }
    }

    async function uploadFile() {
      const localPath = document.getElementById('uploadLocalPath').value.trim()
      const remotePath = document.getElementById('uploadRemotePath').value.trim()
      const mkdir = document.getElementById('uploadMkdir').checked
      const overwrite = document.getElementById('uploadOverwrite').checked

      if (!localPath) {
        setStatus('uploadStatus', '请选择本地文件', 'error')
        return
      }
      if (!remotePath) {
        setStatus('uploadStatus', '请输入远程路径', 'error')
        return
      }

      setStatus('uploadStatus', '正在上传...', 'info')
      try {
        const config = getConfig()
        const result = await sendRequest('upload-file', {
          config,
          localPath,
          remotePath,
          mkdir,
          overwrite
        })
        if (result.success) {
          setStatus('uploadStatus', '上传成功', 'success')
        } else {
          setStatus('uploadStatus', '上传失败: ' + (result.error || '未知错误'), 'error')
        }
      } catch (e) {
        setStatus('uploadStatus', '上传失败: ' + e.message, 'error')
      }
    }

    // ========== 下载文件 ==========
    async function selectDownloadPath() {
      const remotePath = document.getElementById('downloadRemotePath').value.trim()
      const defaultName = remotePath ? remotePath.split('/').pop() : 'download'
      try {
        const result = await sendRequest('select-save-file', { defaultPath: defaultName })
        if (result.filePath) {
          document.getElementById('downloadLocalPath').value = result.filePath
        }
      } catch (e) {
        console.error('选择保存位置失败:', e)
      }
    }

    async function downloadFile() {
      const remotePath = document.getElementById('downloadRemotePath').value.trim()
      const localPath = document.getElementById('downloadLocalPath').value.trim()

      if (!remotePath) {
        setStatus('downloadFileStatus', '请输入远程路径', 'error')
        return
      }
      if (!localPath) {
        setStatus('downloadFileStatus', '请选择保存位置', 'error')
        return
      }

      setStatus('downloadFileStatus', '正在下载...', 'info')
      try {
        const config = getConfig()
        const result = await sendRequest('download-file', {
          config,
          remotePath,
          localPath
        })
        if (result.success) {
          setStatus('downloadFileStatus', '下载成功', 'success')
        } else {
          setStatus('downloadFileStatus', '下载失败: ' + (result.error || '未知错误'), 'error')
        }
      } catch (e) {
        setStatus('downloadFileStatus', '下载失败: ' + e.message, 'error')
      }
    }

    // 通知父容器调整 iframe 高度
    function notifyResize() {
      const height = document.documentElement.scrollHeight
      parent.postMessage({ type: 'newshell:resize', height }, '*')
    }

    window.addEventListener('load', notifyResize)
    window.addEventListener('resize', notifyResize)

    // 监听 DOM 变化（状态文本更新等导致高度变化时重新通知）
    const resizeObserver = new ResizeObserver(() => {
      notifyResize()
    })
    resizeObserver.observe(document.body)

    // 页面加载时读取配置
    loadConfig()
  </script>
</body>
</html>
